experiment:
  name: padim_mvtec_benchmark
  description: PaDiM all-category Anomalib benchmark across all MVTec AD categories.

dataset:
  name: mvtec_ad
  root_dir: data/raw/mvtec_ad
  image_size: 256

  categories:
    - bottle
    - cable
    - capsule
    - carpet
    - grid
    - hazelnut
    - leather
    - metal_nut
    - pill
    - screw
    - tile
    - toothbrush
    - transistor
    - wood
    - zipper

model:
  family: anomalib
  name: padim
  training_mode: normal_only

  # PaDiM is a feature-distribution model.
  # It does not benefit from "30 epochs" the same way a neural classifier does.
  backbone: resnet18
  layers:
    - layer1
    - layer2
    - layer3

engine:
  accelerator: auto
  devices: 1
  max_epochs: 1
  num_workers: 0
  train_batch_size: 8
  eval_batch_size: 8

benchmark:
  seed: 42
  threshold_strategy: anomalib_default

mlflow:
  experiment_name: padim_mvtec_benchmark
  tracking_uri: mlruns

outputs:
  base_model_dir: artifacts/models/benchmarks/padim
  base_report_dir: artifacts/benchmarks/padim
  raw_metrics_dir: artifacts/benchmarks/padim/raw_metrics
  per_category_results_csv: artifacts/benchmarks/padim/per_category_results.csv
  aggregate_results_csv: artifacts/benchmarks/padim/aggregate_results.csv
  markdown_report: artifacts/benchmarks/padim/padim_benchmark_report.md

