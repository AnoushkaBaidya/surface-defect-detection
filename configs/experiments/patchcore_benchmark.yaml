experiment:
  name: patchcore_mvtec_benchmark
  description: PatchCore all-category Anomalib benchmark across all MVTec AD categories.

dataset:
  name: mvtec_ad
  root_dir: data/raw/mvtec_ad
  image_size: 256

  categories:
    - bottle
    - cable
    - capsule
    - carpet
    - grid
    - hazelnut
    - leather
    - metal_nut
    - pill
    - screw
    - tile
    - toothbrush
    - transistor
    - wood
    - zipper

model:
  family: anomalib
  name: patchcore
  training_mode: normal_only

  # PatchCore is a memory-bank nearest-neighbor method.
  # It does not use long supervised training like ResNet18.
  backbone: wide_resnet50_2
  layers:
    - layer2
    - layer3

  # Coreset ratio controls memory bank size.
  # Lower values improve memory/latency; higher values may improve performance.
  coreset_sampling_ratio: 0.1
  num_neighbors: 9

engine:
  accelerator: auto
  devices: 1
  max_epochs: 1
  num_workers: 0
  train_batch_size: 8
  eval_batch_size: 8

benchmark:
  seed: 42
  threshold_strategy: anomalib_default

mlflow:
  experiment_name: patchcore_mvtec_benchmark
  tracking_uri: mlruns

outputs:
  base_model_dir: artifacts/models/benchmarks/patchcore
  base_report_dir: artifacts/benchmarks/patchcore
  raw_metrics_dir: artifacts/benchmarks/patchcore/raw_metrics
  per_category_results_csv: artifacts/benchmarks/patchcore/per_category_results.csv
  aggregate_results_csv: artifacts/benchmarks/patchcore/aggregate_results.csv
  markdown_report: artifacts/benchmarks/patchcore/patchcore_benchmark_report.md

