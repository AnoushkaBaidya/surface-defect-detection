experiment:
  name: winclip_mvtec_benchmark
  description: WinCLIP zero/few-shot benchmark across all MVTec AD categories.

dataset:
  name: mvtec_ad
  root_dir: data/raw/mvtec_ad

  # WinCLIP has fixed 240x240 CLIP preprocessing inside Anomalib.
  # Do not override image size unless your installed Anomalib version exposes it safely.
  categories:
    - bottle
    - cable
    - capsule
    - carpet
    - grid
    - hazelnut
    - leather
    - metal_nut
    - pill
    - screw
    - tile
    - toothbrush
    - transistor
    - wood
    - zipper

model:
  family: vlm
  name: winclip
  training_mode: zero_or_few_shot

  # Official docs default to scales (2, 3).
  scales:
    - 2
    - 3

  # k_shot = 0 -> zero-shot
  # k_shot > 0 -> few-shot normal references
  k_shot_values:
    - 0
    - 1
    - 4

engine:
  accelerator: auto
  devices: 1
  num_workers: 0
  eval_batch_size: 1

benchmark:
  seed: 42
  threshold_strategy: anomalib_default

mlflow:
  experiment_name: winclip_mvtec_benchmark
  tracking_uri: mlruns

outputs:
  base_artifact_dir: artifacts/models/benchmarks/winclip
  base_report_dir: artifacts/benchmarks/winclip
  raw_metrics_dir: artifacts/benchmarks/winclip/raw_metrics
  per_category_results_csv: artifacts/benchmarks/winclip/per_category_results.csv
  aggregate_results_csv: artifacts/benchmarks/winclip/aggregate_results.csv
  markdown_report: artifacts/benchmarks/winclip/winclip_benchmark_report.md

