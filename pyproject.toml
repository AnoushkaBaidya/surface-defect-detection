[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "scripts_archive/"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = [
  "app/tests",
  "drift/tests",
]
pythonpath = ["."]
